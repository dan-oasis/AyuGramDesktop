name: Superseded Windows build

on:
  push:
    branches:
      - codex/windows-x64-7.3.5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superseded:
    name: Superseded — build moved to fix branch
    runs-on: ubuntu-latest
    steps:
      - name: Show current Windows build branch
        run: echo 'The Windows build is now on codex/windows-x64-fix-admin-rights. This workflow does not produce an executable.'
