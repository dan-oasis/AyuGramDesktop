name: Superseded Windows build

on:
  push:
    branches:
      - codex/windows-x64-fix-admin-rights
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superseded:
    name: Superseded — build runs in PR 1
    runs-on: ubuntu-latest
    steps:
      - name: Show current build
        run: echo 'The Windows build now runs as the check on https://github.com/dan-oasis/AyuGramDesktop/pull/1. This workflow does not produce an executable.'
