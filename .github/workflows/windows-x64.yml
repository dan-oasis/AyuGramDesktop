name: mTelegram Windows x64

on:
  pull_request:
    branches:
      - codex/windows-x64-7.3.5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_ROOT: ${{ github.workspace }}\TBuild

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: TBuild/tdesktop
          submodules: recursive
          persist-credentials: false

      - name: Apply mTelegram changes to updated libraries
        working-directory: TBuild/tdesktop
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = @{
            lib_ui = '42c6f1e88db81e6d9e8006f3e7b1c3ba39f9cac4'
            codegen = 'dbd1d53137cd581cfdbeebe93bcaf54abf55ec74'
          }
          foreach ($name in $modules.Keys) {
            $directory = "Telegram/$name"
            $actual = & git -C $directory rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $actual -ne $modules[$name]) {
              throw "Unexpected $name source revision."
            }
            $patch = Join-Path $PWD "build/personal/$name.patch"
            & git -C $directory apply --check $patch
            if ($LASTEXITCODE -ne 0) { throw "Cannot apply $name patch." }
            & git -C $directory apply $patch
            if ($LASTEXITCODE -ne 0) { throw "Cannot apply $name patch." }
          }

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Set up MSVC x64 and Windows SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ Build Tools not found.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $command = '"' + $vcvars + '" -vcvars_ver=14.44 10.0.26100.0 >nul && set'
          $environmentLines = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Required MSVC 14.44 or Windows SDK 10.0.26100.0 is unavailable.' }
          foreach ($line in $environmentLines) {
            if ($line -match '^([^=][^=]*)=(.*)$') {
              $key = $Matches[1]
              $value = $Matches[2]
              [Environment]::SetEnvironmentVariable($key, $value, 'Process')
              if ($key -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)') {
                "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }
          New-Item -ItemType Directory -Force "$env:BUILD_ROOT\Libraries\win64", "$env:BUILD_ROOT\ThirdParty" | Out-Null
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake not available.' }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw 'Ninja not available.' }

      - name: Restore dependency cache
        id: deps_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            TBuild/Libraries/win64
            TBuild/ThirdParty
          key: windows-x64-msvc1444-qt6-debug-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}-complete-v2
          restore-keys: |
            windows-x64-msvc1444-qt6-debug-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}-42062979528
            windows-x64-msvc1444-qt6-debug-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}-42030330345
            windows-x64-msvc1444-qt6-debug-ee4d481a0109ca2846167b76ff8a8f83d29589f82a080c4f6de769071da4ed65-complete-v2

      - name: Prepare Debug libraries
        id: prepare_libraries
        shell: cmd
        run: |
          call "%BUILD_ROOT%\tdesktop\Telegram\build\prepare\win.bat" skip-release qt6
          if errorlevel 1 exit /b 1

      - name: Prepare Qt WebSockets
        working-directory: TBuild/tdesktop
        run: |
          $ErrorActionPreference = 'Stop'
          $qtVersion = python -c "import os, sys; sys.path.insert(0, 'Telegram/build'); from qt_version import resolve; resolve('x64'); print(os.environ['QT'])" | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or $qtVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Could not resolve Qt version' }
          $prefix = Join-Path $env:BUILD_ROOT "Libraries\win64\Qt-$qtVersion"
          $package = Join-Path $prefix 'lib\cmake\Qt6WebSockets\Qt6WebSocketsConfig.cmake'
          if (-not (Test-Path $package)) {
            $module = Join-Path $env:BUILD_ROOT 'qtwebsockets-src'
            $build = Join-Path $env:BUILD_ROOT 'qtwebsockets-build'
            git clone --depth 1 --branch "v$qtVersion" https://github.com/qt/qtwebsockets.git $module
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch Qt WebSockets' }
            New-Item -ItemType Directory -Force $build | Out-Null
            Set-Location $build
            $libraries = Split-Path -Parent $prefix
            $zlib = Join-Path $libraries 'zlib'
            $openssl = Join-Path $libraries 'openssl3'
            $configureArgs = @(
              $module, '-cmake-generator', 'Ninja', '--'
              '-DCMAKE_BUILD_TYPE=Debug'
              '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDebug'
              '-DQT_BUILD_TESTS=OFF'
              '-DQT_BUILD_EXAMPLES=OFF'
              "-DZLIB_INCLUDE_DIR=$zlib"
              "-DZLIB_LIBRARY_DEBUG=$zlib/Debug/libzsd.lib"
              "-DOPENSSL_INCLUDE_DIR=$openssl/include"
              "-DLIB_EAY_DEBUG=$openssl/out.dbg/libcrypto.lib"
              "-DSSL_EAY_DEBUG=$openssl/out.dbg/libssl.lib"
            )
            & (Join-Path $prefix 'bin\qt-configure-module.bat') @configureArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not configure Qt WebSockets' }
            cmake --build . --parallel 2
            if ($LASTEXITCODE -ne 0) { throw 'Could not compile Qt WebSockets' }
            cmake --install . --prefix $prefix
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $package)) { throw 'Could not install Qt WebSockets' }
          }

      - name: Configure personal Debug build
        shell: cmd
        working-directory: TBuild/tdesktop/Telegram
        run: |
          call configure.bat -G "Ninja Multi-Config" qt6 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -D CMAKE_CONFIGURATION_TYPES=Debug ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D MTELEGRAM_REQUIRE_WSS=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if errorlevel 1 exit /b 1

      - name: Compile Windows executables
        shell: cmd
        working-directory: TBuild/tdesktop
        run: |
          cmake --build out --config Debug --parallel 2 -- -k 0
          if errorlevel 1 exit /b 1

      - name: Collect binaries and source identity
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:BUILD_ROOT 'tdesktop'
          $output = Join-Path $source 'out\Debug'
          $exe = Join-Path $output 'mTelegram.exe'
          if (-not (Test-Path $exe)) { throw 'Build did not produce mTelegram.exe.' }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $exe artifact
          Get-ChildItem $output -Filter '*.dll' -File | Copy-Item -Destination artifact
          $identity = @{
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            commit = $env:GITHUB_SHA
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            configuration = 'Debug'
            architecture = 'x64'
            runtime_tested = $false
            submodules = @(& git -C $source submodule status --recursive)
          }
          $identity | ConvertTo-Json -Depth 4 | Set-Content artifact/build-info.json -Encoding utf8
          Get-ChildItem artifact -File | ForEach-Object {
            $digest = Get-FileHash $_.FullName -Algorithm SHA256
            "$($digest.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content artifact/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mTelegram-Windows-x64-Debug-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve completed dependency stages
        if: ${{ always() && !cancelled() && steps.prepare_libraries.outcome == 'success' && steps.deps_cache.outputs['cache-hit'] != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            TBuild/Libraries/win64
            TBuild/ThirdParty
          key: windows-x64-msvc1444-qt6-debug-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}-complete-v2

